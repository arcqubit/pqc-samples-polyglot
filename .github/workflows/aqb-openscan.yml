name: AQB OpenScan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'microservices/**'
      - 'lib-crypto/**'
      - 'legacy-service/**'
      - 'README.md'
      - '.aqb-openscan-cli.yaml'
      - 'tools/aqb-openscan-cli/**'
      - '.github/workflows/aqb-openscan.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'microservices/**'
      - 'lib-crypto/**'
      - 'legacy-service/**'
      - 'README.md'
      - '.aqb-openscan-cli.yaml'
      - 'tools/aqb-openscan-cli/**'
      - '.github/workflows/aqb-openscan.yml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  scan:
    name: Scan polyglot source on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare comparison source
        id: baseline
        uses: actions/github-script@v9
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        with:
          script: |
            const ref = process.env.BASE_SHA;
            if (!/^[0-9a-f]{40}$/.test(ref) || /^0+$/.test(ref)) {
              core.info('No previous commit available; reporting an inventory scan.');
              return;
            }
            try {
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path: '', ref,
              });
              if (Array.isArray(data)) core.setOutput('available', 'true');
            } catch (error) {
              if (![404, 422].includes(error.status)) throw error;
              core.info('Comparison source unavailable; reporting an inventory scan.');
            }

      - name: Check out comparison source
        if: steps.baseline.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .aqb-openscan-baseline

      - name: Verify Linux aqb-openscan-cli
        working-directory: tools/aqb-openscan-cli
        run: |
          python3 -m unittest discover -s ../../.github/scripts -p 'test_*.py'
          sha256sum --check checksums-linux.txt
          chmod +x aqb-openscan-cli-linux-amd64
          ./aqb-openscan-cli-linux-amd64 version

      - name: Scan polyglot source and display collapsed JSON
        id: scan
        env:
          AQB_OPENSCAN_REPORT: ${{ runner.temp }}/aqb-openscan/polyglot-findings.json
        run: |
          mkdir -p "$(dirname "$AQB_OPENSCAN_REPORT")"
          set +e
          ./tools/aqb-openscan-cli/aqb-openscan-cli-linux-amd64 scan . \
            --exclude "tools/*,.github/*,.aqb-openscan-baseline/*" \
            --format json --pretty --no-color --output "$AQB_OPENSCAN_REPORT"
          scan_status=$?
          set -e
          if [[ -f "$AQB_OPENSCAN_REPORT" ]]; then
            echo "report_exists=true" >> "$GITHUB_OUTPUT"
          fi
          python3 .github/scripts/aqb_openscan_report.py "$AQB_OPENSCAN_REPORT" "$scan_status"

      - name: Scan comparison source
        if: steps.baseline.outputs.available == 'true'
        env:
          AQB_OPENSCAN_BASELINE: ${{ runner.temp }}/aqb-openscan/baseline-findings.json
        run: |
          set +e
          ./tools/aqb-openscan-cli/aqb-openscan-cli-linux-amd64 scan "$GITHUB_WORKSPACE/.aqb-openscan-baseline" \
            --exclude "tools/*,.github/*,.aqb-openscan-baseline/*" \
            --format json --pretty --no-color --output "$AQB_OPENSCAN_BASELINE"
          scan_status=$?
          set -e
          python3 .github/scripts/aqb_openscan_report.py "$AQB_OPENSCAN_BASELINE" "$scan_status" --quiet

      - name: Publish Actions summary and source annotations
        env:
          AQB_OPENSCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AQB_OPENSCAN_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_AVAILABLE: ${{ steps.baseline.outputs.available }}
        run: |
          baseline_args=()
          if [[ "$BASE_AVAILABLE" == 'true' ]]; then
            baseline_args=(--baseline-report "$RUNNER_TEMP/aqb-openscan/baseline-findings.json"
              --baseline-root "$GITHUB_WORKSPACE/.aqb-openscan-baseline" --baseline-sha "$BASE_SHA")
          fi
          python3 .github/scripts/aqb_openscan_feedback.py \
            "$RUNNER_TEMP/aqb-openscan/polyglot-findings.json" "$GITHUB_WORKSPACE" "${baseline_args[@]}"

      - name: Generate GitHub-ready SARIF
        id: sarif
        env:
          AQB_OPENSCAN_REPORT: ${{ runner.temp }}/aqb-openscan/polyglot-findings.json
          AQB_OPENSCAN_SARIF: ${{ runner.temp }}/aqb-openscan/polyglot-findings.sarif
        run: |
          set +e
          ./tools/aqb-openscan-cli/aqb-openscan-cli-linux-amd64 scan . \
            --exclude "tools/*,.github/*,.aqb-openscan-baseline/*" \
            --format sarif --no-color --output "$AQB_OPENSCAN_SARIF"
          scan_status=$?
          set -e
          if [[ -f "$AQB_OPENSCAN_SARIF" ]]; then
            echo "report_exists=true" >> "$GITHUB_OUTPUT"
          fi
          python3 .github/scripts/aqb_openscan_sarif.py \
            "$AQB_OPENSCAN_SARIF" "$AQB_OPENSCAN_REPORT" "$GITHUB_WORKSPACE" "$scan_status"

      - name: Upload AQB OpenScan reports
        if: ${{ always() && (steps.scan.outputs.report_exists == 'true' || steps.sarif.outputs.report_exists == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: aqb-openscan-polyglot-report
          path: |
            ${{ runner.temp }}/aqb-openscan/polyglot-findings.json
            ${{ runner.temp }}/aqb-openscan/polyglot-findings.sarif
            ${{ runner.temp }}/aqb-openscan/polyglot-findings.md
            ${{ runner.temp }}/aqb-openscan/polyglot-findings.html
          retention-days: 7
          if-no-files-found: error

  code-scanning:
    name: Optional GitHub Code Scanning
    needs: scan
    # Keep write permissions away from scanner execution and fork PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check Code Scanning availability
        id: availability
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.codeScanning.listRecentAnalyses({
                ...context.repo,
                per_page: 1,
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              const message = error.response?.data?.message || error.message;
              if (error.status === 403 && message.includes('Code scanning is not enabled')) {
                core.setOutput('enabled', 'false');
                await core.summary
                  .addRaw('<details><summary>Optional GitHub Code Scanning integration</summary>\n\n')
                  .addRaw('Code Scanning is unavailable for this repository. AQB OpenScan results are available in the scan job summary, prioritized Actions annotations, and downloadable JSON, SARIF, and HTML reports.\n\n')
                  .addRaw('Eligible repositories also receive native alerts under Security → Code Scanning. Private repositories require GitHub Code Security for that additional destination.\n\n</details>\n')
                  .write();
              } else {
                throw error;
              }
            }

      - name: Check out source for alert fingerprints
        if: steps.availability.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download validated scan reports
        if: steps.availability.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: aqb-openscan-polyglot-report
          path: ${{ runner.temp }}/aqb-openscan

      - name: Upload SARIF to Code Scanning
        if: steps.availability.outputs.enabled == 'true'
        id: upload
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/aqb-openscan/polyglot-findings.sarif
          checkout_path: ${{ github.workspace }}
          category: aqb-openscan-polyglot
          wait-for-processing: true

      - name: Summarize Code Scanning upload
        if: ${{ always() && steps.availability.outputs.enabled == 'true' }}
        uses: actions/github-script@v9
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        with:
          script: |
            const uploaded = process.env.UPLOAD_OUTCOME === 'success';
            const alerts = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/security/code-scanning`;
            await core.summary
              .addHeading('GitHub Code Scanning upload')
              .addRaw(uploaded
                ? `**Uploaded and processed.** View [AQB OpenScan alerts](${alerts}) under **Security → Code Scanning**.\n\n`
                : '**Upload did not complete.** Inspect this job for the error; downloadable JSON and SARIF reports remain available.\n\n')
              .addRaw('This is an additional destination; AQB OpenScan feedback is also available in Actions summaries, source annotations, and downloadable reports without Code Security. The upload action computes alert fingerprints from the checked-out source. Native Code Scanning checks use their own severity policy.\n')
              .write();
